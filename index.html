<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Generator</title>
  <link rel="stylesheet" href="styles.css?v=11">
  <style>
    :root { --bg:#0f1115; --text:#e6e8ee; --muted:#8a8fa3; --card:#141821; --chip:#22293a; --accent:#5e7aff; --shadow: 0 10px 28px rgba(0,0,0,.25); }
    [data-theme="light"] { --bg:#f6f7fb; --text:#1b1e27; --muted:#55607a; --card:#ffffff; --chip:#eef1f7; --accent:#356aff; --shadow: 0 10px 28px rgba(0,0,0,.08); }
    html,body { height:100%; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; background:var(--bg); color:var(--text); }
    .wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .row { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
    .rail { max-width:900px; margin: 0 auto 28px; opacity:.9; }
    input[type=range] { width:100%; height:6px; background:linear-gradient(90deg, var(--accent), #9aa8ff); border-radius:6px; outline: none; appearance: none; }
    input[type=range]::-webkit-slider-thumb { appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); box-shadow:0 2px 10px rgba(94,122,255,.5); cursor:pointer; }
    .ticks { display:flex; max-width:900px; margin:8px auto 24px; justify-content:space-between; color:var(--muted); font-size:12px; letter-spacing:.02em; }
    .btn, .dd-trigger { background: var(--chip); border:1px solid rgba(255,255,255,.08); color:var(--text); padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; box-shadow: var(--shadow); }
    .btn:hover, .dd-trigger:hover { filter:brightness(1.05); }
    /* dropdown */
    #topicDropdown { position:relative; }
    .dd-trigger { display:flex; align-items:center; gap:8px; }
    .dd-trigger .chev{ opacity:.7 }
    .dd-menu { position:absolute; top:calc(100% + 8px); left:0; background:var(--card); box-shadow: var(--shadow); border-radius:12px; padding:8px; list-style:none; margin:0; min-width:220px; display:none; border:1px solid rgba(255,255,255,.06); }
    #topicDropdown.open .dd-menu { display:block; }
    .dd-option { padding:10px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
    .dd-option[aria-selected="true"] { background: rgba(94,122,255,.15); }
    .cards { display:grid; grid-template-columns: 1fr; gap:14px; margin-top:26px; }
    @media(min-width:720px){ .cards{ grid-template-columns: 1fr; } }
    .card { background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:16px; box-shadow: var(--shadow); }
    .term { font-size:18px; font-weight:700; margin-bottom:8px; }
    .badges { display:inline-flex; gap:6px; }
    .badge { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); padding:2px 8px; border-radius:999px; font-size:12px; color:var(--muted); }
    .meta { margin-top:10px; font-size:13px; color:var(--muted); }
    .meta a { color:var(--text); text-decoration:none; border-bottom:1px solid rgba(255,255,255,.2); }
    .sep { opacity:.5; padding:0 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="rail">
      <input id="level" type="range" min="0" max="5" step="1" value="0" />
    </div>
    <div class="ticks">
      <span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span>
    </div>

    <div class="row">
      <div id="topicDropdown"></div>
      <button id="btn" class="btn">⚡ Generate</button>
      <button id="themeToggle" class="btn">🌙 Dark</button>
    </div>

    <div id="list" class="cards" aria-live="polite"></div>
  </div>

  <script src="script.js?v=13" type="module"></script>
</body>
</html>
