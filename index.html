<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Generator</title>
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <div class="wrap">
    <div class="rail">
      <input id="level" type="range" min="0" max="5" step="1" value="0" />
    </div>
    <div class="ticks">
      <span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span>
    </div>

    <div class="row controls">
      <div id="topicDropdown"></div>
      <button id="favToggle" class="btn btn-ghost" aria-pressed="false" title="Show only favorites">
        <span class="icon">☆</span> Favorites only
      </button>
      <button id="btn" class="btn"><span class="icon">⚡</span> Generate</button>
      <button id="themeToggle" class="btn"><span class="icon">🌙</span> Dark</button>
    </div>

    <div id="list" class="cards" aria-live="polite"></div>
  </div>

  <script src="script.js?v=14" type="module"></script>
</body>
</html>
